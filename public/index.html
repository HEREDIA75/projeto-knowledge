<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Hub - Terminal & Viz</title>

  <!-- Libs Externas de Renderização -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- SDKs do Firebase Hosting -->
  <script defer src="/__/firebase/12.19.0/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/12.19.0/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/12.19.0/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar de Navegação -->
    <aside class="sidebar">
      <div class="logo">
        <span class="icon">>_</span> KNOWLEDGE_HUB
      </div>
      
      <nav class="menu">
        <button class="menu-item active" onclick="switchTab('fibonacci')">
          <span>🌐</span> Geometria & Fibonacci 3D
        </button>
        <button class="menu-item" onclick="switchTab('galaxy')">
          <span>🌌</span> Galáxia Interativa 3D
        </button>
        <button class="menu-item" onclick="switchTab('sorting')">
          <span>📊</span> Insertion Sort & Big-O
        </button>
        <button class="menu-item" onclick="switchTab('terminal')">
          <span>💻</span> Terminal OSINT / Cyber
        </button>
        <button class="menu-item" onclick="switchTab('login_anim')">
          <span>🔑</span> Login Interativo Animado
        </button>
        <button class="menu-item" onclick="switchTab('courses')">
          <span>📚</span> Cursos & Aulas
        </button>
      </nav>

      <div class="system-status">
        <div id="render-status"><span class="dot"></span> API Render: Checando...</div>
        <div id="firebase-status"><span class="dot"></span> Firebase: Inicializando...</div>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <header class="topbar">
        <h1 id="tab-title">Esfera 3D & Geometria Sagrada (Fibonacci Sphere)</h1>
        <div class="user-badge" id="user-info">Visitante</div>
      </header>

      <section id="view-container" class="view-container">
        <!-- Conteúdo dinâmico injetado via JS -->
      </section>
    </main>
  </div>

 
  
  <!-- Controlador Principal -->
  <script src="app.js"></script>
</body>
</html>
