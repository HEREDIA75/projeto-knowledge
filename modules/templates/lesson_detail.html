<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ lesson.title }} - Knowledge Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-4">
        <h2>{{ course.title }} - {{ lesson.title }}</h2>
        <hr class="border-secondary">

        <div class="row">
            <!-- Instruções da Lição -->
            <div class="col-md-6">
                <div class="card bg-secondary text-white mb-3">
                    <div class="card-body">
                        <h5>Conteúdo Teórico</h5>
                        <p>{{ lesson.content }}</p>
                    </div>
                </div>
            </div>

            <!-- Editor de Código e Submissão -->
            <div class="col-md-6">
                {% for challenge in challenges %}
                <div class="card bg-secondary text-white mb-3">
                    <div class="card-body">
                        <h5>{{ challenge.title }} ({{ challenge.get_language_display }})</h5>
                        <p>{{ challenge.instructions }}</p>

                        <textarea id="code-{{ challenge.id }}" class="form-control font-monospace bg-dark text-white mb-2" rows="5">{{ challenge.initial_code }}</textarea>
                        
                        <button onclick="submitSolution({{ challenge.id }})" class="btn btn-primary">
                            Enviar Solução (+{{ challenge.points }} XP)
                        </button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        async function submitSolution(challengeId) {
            const code = document.getElementById(`code-${challengeId}`).value;
            const token = localStorage.getItem("firebase_token"); // Obtido após login no Firebase Auth Client

            const response = await fetch('/api/user/challenges/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    challenge_id: challengeId,
                    submitted_code: code
                })
            });

            const data = await response.json();
            alert(data.completed ? "Desafio Concluído! XP Registrado." : "Resposta incorreta, tente novamente.");
        }
    </script>
</body>
</html>
