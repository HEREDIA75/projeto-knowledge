<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Project - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <h1 class="mb-4">Trilhas de Conhecimento</h1>
        
        <!-- ================= IFRAME DO JOGO AQUI ================= -->
        <div class="row mb-5">
            <div class="col-12 text-center">
                <div class="card bg-secondary p-3 d-inline-block shadow">
                    <h4 class="mb-3 text-white">Arcade Mini-Game</h4>
                    <iframe 
                        src="/jogos/neon-tetris/index.html" 
                        width="320" 
                        height="450" 
                        style="border: 2px solid #00ffff; border-radius: 8px; background: #000;">
                    </iframe>
                </div>
            </div>
        </div>
        <!-- ======================================================== -->

        <div class="row">
            {% for course in courses %}
            <div class="col-md-4 mb-4">
                <div class="card bg-secondary text-white h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ course.title }}</h5>
                        <p class="card-text">{{ course.description }}</p>
                    </div>
                </div>
            </div>
            {% empty %}
            <p>Nenhum curso ativo no momento.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
