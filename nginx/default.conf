# Define o backend Django (serviço 'web' da porta 8000 do docker-compose)
upstream django_backend {
    server erp_django:8000;
}

server {
    listen 80;
    server_name localhost promptdevgames.com.br *.promptdevgames.com.br;

    # Limite para upload de arquivos (aumentado para suportar mídias/documentos)
    client_max_body_size 50M;

    # Timeouts de proxy
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 1. Arquivos Estáticos do Django (CSS, JS do Admin, etc.)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Arquivos de Mídia enviados por usuários
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Encaminha todas as requisições (API, Admin, Páginas) para o Django
    location / {
        proxy_pass http://django_backend;

        # Cabeçalhos HTTP para repassar o IP e protocolo real do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets e conexões persistentes (HTTP 1.1)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }
}