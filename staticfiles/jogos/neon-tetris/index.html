<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tetris</title>
    <!-- Aponta para a diretoria correta de estáticos do Django/WhiteNoise -->
    <link rel="stylesheet" href="/static/jogos/neon-tetris/style.css">
</head>
<body>
    <main class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
    </main>
    
    <!-- O atributo 'defer' garante que o JS só executa após o DOM e o Canvas estarem carregados -->
    <script src="/static/jogos/neon-tetris/game.js" defer></script>
</body>
</html>
